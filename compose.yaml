# Environnement CDA — Docker Compose
# Apache, MySQL, Adminer et Node.js

services:
  # Serveur web Apache
  web:
    image: httpd:2.4
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../ma-page-dev/dist:/usr/local/apache2/htdocs:ro

  # Base de données MySQL
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Renseignez MYSQL_ROOT_PASSWORD dans .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Renseignez MYSQL_DATABASE dans .env}"
      MYSQL_USER: "${MYSQL_USER:?Renseignez MYSQL_USER dans .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Renseignez MYSQL_PASSWORD dans .env}"
    volumes:
      - donnees-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Interface d'administration MySQL
  adminer:
    image: adminer:6
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  # Serveur de développement Node.js / Vite
  node:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../ma-page-dev:/app
      - node-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      DANS_DOCKER: "oui"

volumes:
  donnees-mysql:
    external: true
    name: cda-donnees

  node-modules:
